<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineGrade</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131c;color:#fff;font-family:Arial,sans-serif;padding:18px}.top{font-size:27px;font-weight:800;letter-spacing:1px}.sub{color:#aab3c5;margin:6px 0 22px}.panel{background:#1b2130;border:1px solid #30394d;border-radius:18px;padding:16px;margin:14px 0}button,.pick{background:#e5a83b;color:#171717;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;display:inline-block}input[type=file]{display:none}#preview{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#0b0d12;margin-top:12px;display:none}.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.filters button{background:#30394d;color:#fff}.filters button.active{background:#e5a83b;color:#151515}.range{width:100%;accent-color:#e5a83b;margin:12px 0}.hint{color:#9da8ba;font-size:13px;line-height:1.5}h3{margin:0 0 12px}
</style></head><body><div class="top">🎬 CineGrade</div><div class="sub">Mobile photo color grading studio</div>
<div class="panel"><h3>अपनी फोटो चुनें</h3><label class="pick" for="file">＋ फोटो चुनें</label><input id="file" type="file" accept="image/*"><img id="preview"><p class="hint">गैलरी से फोटो चुनें, फिर नीचे cinematic looks लगाएँ।</p></div>
<div class="panel"><h3>Cinematic Looks</h3><div class="filters"><button data-f="none" class="active">Original</button><button data-f="cinema">Cinematic</button><button data-f="teal">Teal & Orange</button><button data-f="moody">Moody</button><button data-f="warm">Warm</button><button data-f="bw">Black & White</button></div></div>
<div class="panel"><h3>Adjustments</h3><label>Brightness</label><input class="range" id="bright" type="range" min="50" max="160" value="100"><label>Contrast</label><input class="range" id="contrast" type="range" min="50" max="180" value="100"><label>Saturation</label><input class="range" id="sat" type="range" min="0" max="200" value="100"><button id="save" style="width:100%;margin-top:10px">⬇ फोटो सेव करें</button></div>
<p class="hint">CineGrade शुरुआती संस्करण • फोटो एडिटिंग उपलब्ध • वीडियो रिकॉर्डिंग/वीडियो ग्रेडिंग अभी शामिल नहीं है।</p>
<script>
const file=document.getElementById('file'),img=document.getElementById('preview');let preset='none';
file.onchange=()=>{if(file.files[0]){img.src=URL.createObjectURL(file.files[0]);img.style.display='block'}};
const looks={none:'none',cinema:'contrast(1.18) saturate(.82) sepia(.12)',teal:'contrast(1.15) saturate(1.25) hue-rotate(8deg)',moody:'brightness(.82) contrast(1.28) saturate(.72)',warm:'sepia(.25) saturate(1.25)',bw:'grayscale(1) contrast(1.15)'};
function apply(){img.style.filter=looks[preset]+' brightness('+document.getElementById('bright').value+'%) contrast('+document.getElementById('contrast').value+'%) saturate('+document.getElementById('sat').value+'%)'}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');preset=b.dataset.f;apply()});
['bright','contrast','sat'].forEach(id=>document.getElementById(id).oninput=apply);
document.getElementById('save').onclick=()=>{if(!img.src){alert('पहले फोटो चुनें');return}const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;ctx.filter=looks[preset]+' brightness('+bright.value+'%) contrast('+contrast.value+'%) saturate('+sat.value+'%)';ctx.drawImage(img,0,0);const a=document.createElement('a');a.download='CineGrade.jpg';a.href=c.toDataURL('image/jpeg',.95);a.click()};
</script></body></html>
